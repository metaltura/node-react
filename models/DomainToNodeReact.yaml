      - name: ReactEntityToApiClient
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:react.EntityToApiClient
        x: 0
        'y': -240
        width: 200
        height: 56
      - name: MongoEntityToCollection
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:mongo.EntityToCollection
        x: 250
        'y': -240
        width: 200
        height: 56
      - name: MongoFieldToField
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:mongo.FieldToField
        x: 250
        'y': -140
        width: 200
        height: 56
      - name: MongoRelationToReference
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:mongo.RelationToReference
        x: 250
        'y': -40
        width: 200
        height: 56
      - name: NodeEntityToModel
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:node.EntityToModel
        x: 500
        'y': -240
        width: 200
        height: 56
      - name: NodeEntityToService
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:node.EntityToService
        x: 500
        'y': -140
        width: 200
        height: 56
      - name: NodeEntityToRouter
        instanceOf: Diagram:core.Node
        element: DomainToNodeReact:node.EntityToRouter
        x: 500
