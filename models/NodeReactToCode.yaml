name: NodeReactToCode
instanceOf: Core:Model
elements:
  - name: node
    instanceOf: Core:Package
    elements:
      - name: NodePattern
        instanceOf: Core:Class
        abstract: true
        icon: mui:Code
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: routersOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: service
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:service.Service
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Node:express.Router
            code: |
              /**
               * The routers of the server that call a Node service, in the order
               * of the server.
               */
              export default function (service: any) {
                const routers: any[] = service.server?.routers ?? []
                return routers.filter((router: any) => router.service === service)
              }
          - name: modelOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: router
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Router
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: false
              type: Node:mongoose.Model
            code: |
              /**
               * The Mongoose model a router works with (rule 28): among the models
               * of its service, the one whose collection has the name of the
               * resource of the router. None: undefined.
               */
              export default function (router: any) {
                const resource = router.resource?.name
                const models: any[] = router.service?.models ?? []
                return models.find((model: any) => model.collection?.name === resource)
              }
          - name: routedOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: router
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Router
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Application:http.Endpoint
            code: |
              /**
               * The endpoints of a router its service implements (rules 10 and
               * 28): the first endpoint of each known operation, when the service
               * has the model of the resource and the endpoint has the payloads
               * its operation needs — a response to list, read, create or update,
               * a request to create or update. The router answers 501 to the
               * others.
               */
              export default function (router: any) {
                if (!this.modelOf(router)) return []
                const seen = new Set<string>()
                const endpoints: any[] = router.endpoints ?? []
                return endpoints.filter((endpoint: any) => {
                  const operation = this.operationOf(endpoint)
                  if (operation === 'unknown' || seen.has(operation)) return false
                  const writes = operation === 'create' || operation === 'update'
                  if (operation !== 'delete' && !endpoint.response) return false
                  if (writes && !endpoint.request) return false
                  seen.add(operation)
                  return true
                })
              }
          - name: serviceFunctionOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: router
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Router
              - name: operation
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:String
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The name of the function of a Node service a router calls for an
               * operation (rule 28): `list`, `get`, `create`, `update` or `remove`,
               * followed by the resource when the service serves several
               * resources (`listCommande`).
               */
              export default function (router: any, operation) {
                const name = operation === 'delete' ? 'remove' : operation
                const routers: any[] = this.routersOf(router.service)
                const resources = new Set(routers.map((r: any) => r.resource))
                if (resources.size <= 1) return name
                return `${name}${this.pascalOf(router.resource.name)}`
              }
      - name: ServerToProject
        instanceOf: Core:Class
        icon: thesvg:nodedotjs
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Server
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import {
                Folder,
                MarkdownFile,
                TextFile,
                TypeScriptFile
              } from 'FileSystem'
              import { resourceToPayloadTypes } from 'ApplicationToCode/code'
              import {
                modelToFile,
                routerToFile,
                serviceToFile
              } from 'NodeReactToCode/node'

              /**
               * ServerToProject — the stack pattern for Node + Express (rules 24
               * and 25). Branched on a Node server, it writes the TypeScript
               * project in a system folder:
               * - `package.json`, `tsconfig.json`, `.gitignore` and `README.md`;
               * - under `src/`: `index.ts`, which mounts a router per router of
               *   the server and answers 400 to a record Mongoose refuses, a Mongoose model per model (ModelToFile), a module
               *   per service (ServiceToFile), a router per router (RouterToFile)
               *   and the types of the payloads of each resource its routers
               *   expose (ResourceToPayloadTypes).
               * The imports are ES modules resolved by NodeNext: a relative import
               * names its `.js` file.
               */
              export default function (source) {
                const server: any = source
                if (!server.application) {
                  throw new Error(`${server.name}: the server has no application`)
                }
                const routers: any[] = server.routers ?? []
                const models: any[] = server.models ?? []
                const services: any[] = server.services ?? []
                const resources = routers
                  .map((router: any) => router.resource)
                  .filter((r: any, i: number, all: any[]) => r && all.indexOf(r) === i)
                const mongoUrl = mongoUrlOf(this, server)
                const textFile = (name: string, ext: string, fileType: string, lines: string[]) =>
                  new TextFile({
                    name: this.fileNameOf(name, ext),
                    fileType,
                    text: this.textOf(lines)
                  })
                return [
                  textFile('package', 'json', 'json', packageOf(this, server)),
                  textFile('tsconfig', 'json', 'json', TSCONFIG),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist']),
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(this, server, resources, mongoUrl))
                  }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new TypeScriptFile({
                        name: this.fileNameOf('index', 'ts'),
                        text: this.textOf(indexOf(this, server, routers, mongoUrl))
                      }),
                      new Folder({
                        name: 'models',
                        entries: models.map((m: any) => map(m, modelToFile))
                      }),
                      new Folder({
                        name: 'services',
                        entries: services.map((s: any) => map(s, serviceToFile))
                      }),
                      new Folder({
                        name: 'routes',
                        entries: routers.map((r: any) => map(r, routerToFile))
                      }),
                      new Folder({
                        name: 'payloads',
                        entries: resources
                          .map((r: any) => map(r, resourceToPayloadTypes))
                      })
                    ]
                  })
                ]
              }

              /** The lines of `tsconfig.json`: strict, NodeNext, ES2022. */
              const TSCONFIG = [
                '{',
                '  "compilerOptions": {',
                '    "target": "ES2022",',
                '    "module": "NodeNext",',
                '    "moduleResolution": "NodeNext",',
                '    "strict": true,',
                '    "esModuleInterop": true,',
                '    "skipLibCheck": true,',
                '    "outDir": "dist",',
                '    "rootDir": "src"',
                '  },',
                '  "include": ["src"]',
                '}'
              ]

              /** The lines of `package.json`, versions pinned (rule 24). */
              function packageOf(pattern: any, server: any): string[] {
                return [
                  '{',
                  `  "name": "${pattern.kebabOf(server.name)}",`,
                  '  "version": "0.1.0",',
                  '  "private": true,',
                  '  "type": "module",',
                  '  "scripts": {',
                  '    "start": "tsx src/index.ts",',
                  '    "build": "tsc",',
                  '    "typecheck": "tsc --noEmit"',
                  '  },',
                  '  "dependencies": {',
                  '    "express": "5.1.0",',
                  '    "mongoose": "8.9.5"',
                  '  },',
                  '  "devDependencies": {',
                  '    "@types/express": "5.0.0",',
                  '    "@types/node": "22.10.7",',
                  '    "tsx": "4.19.2",',
                  '    "typescript": "5.7.3"',
                  '  }',
                  '}'
                ]
              }

              /**
               * The MongoDB database of the application, the first one (rule 25).
               */
              function databaseOf(server: any): any {
                const stores: any[] = server.application.stores ?? []
                const mongo = stores.filter((s: any) =>
                  s.instanceOf?._path?.() === 'Application:mongo.Database')
                if (mongo.length === 0) {
                  const app = server.application.name
                  log.warning(`${server.name}: no MongoDB database in ${app}`)
                  return undefined
                }
                if (mongo.length > 1) {
                  const n = mongo.length
                  log.warning(`${server.name}: ${n} MongoDB databases, using ${mongo[0].name}`)
                }
                return mongo[0]
              }

              /** The default `MONGO_URL`: the database in kebab-case. */
              function mongoUrlOf(pattern: any, server: any): string {
                const database = databaseOf(server)
                const name = pattern.kebabOf(database ? database.name : server.name)
                return `mongodb://localhost:27017/${name}`
              }

              /**
               * The lines of `src/index.ts`: the Express application, JSON bodies,
               * a router mounted on the route of its resource, the error handler,
               * MongoDB, then the port of `PORT`, of the server or 3000.
               */
              function indexOf(
                pattern: any,
                server: any,
                routers: any[],
                mongoUrl: string
              ): string[] {
                const mounted = routers.filter((router: any) => {
                  if (router.resource) return true
                  log.warning(`${router.name}: the router has no resource, not mounted`)
                  return false
                })
                const port = server.port ?? 3000
                return [
                  'import express, {',
                  '  type NextFunction,',
                  '  type Request,',
                  '  type Response',
                  "} from 'express'",
                  "import mongoose from 'mongoose'",
                  ...mounted.map((router: any) => {
                    const file = pattern.pascalOf(router.name)
                    return `import ${pattern.camelOf(router.name)} from './routes/${file}.js'`
                  }),
                  '',
                  'const app = express()',
                  'app.use(express.json())',
                  ...mounted.map((router: any) => {
                    const route = pattern.routeOf(router.resource)
                    return `app.use('${route}', ${pattern.camelOf(router.name)})`
                  }),
                  '',
                  ...ERROR_HANDLER,
                  '',
                  'const mongoUrl =',
                  `  process.env.MONGO_URL ?? '${mongoUrl}'`,
                  `const port = Number(process.env.PORT ?? ${port})`,
                  '',
                  'await mongoose.connect(mongoUrl)',
                  'app.listen(port, () => {',
                  `  console.log(\`${server.name} listening on http://localhost:\${port}\`)`,
                  '})'
                ]
              }

              /**
               * The lines of the error handler (Q3 of the story of the React
               * pattern): a record Mongoose refuses answers 400 with the reason of
               * each field in error (`{ "errors": { "nom": "required" } }`), any
               * other error 500 with its message. Four parameters: Express knows
               * an error handler by its arity.
               */
              const ERROR_HANDLER = [
                'app.use(',
                '  (error: Error, _req: Request, res: Response, _next: NextFunction) => {',
                '    if (error instanceof mongoose.Error.ValidationError) {',
                '      const errors = Object.fromEntries(',
                '        Object.entries(error.errors)',
                '          .map(([field, reason]) => [field, reason.kind])',
                '      )',
                '      res.status(400).json({ errors })',
                '      return',
                '    }',
                '    res.status(500).json({ error: error.message })',
                '  }',
                ')'
              ]

              /** The lines of `README.md`. */
              function readmeOf(
                pattern: any,
                server: any,
                resources: any[],
                mongoUrl: string
              ): string[] {
                const title = server.application.title || server.application.name
                return [
                  `# ${title} — Node + Express`,
                  '',
                  `Generated from the Node server \`${server.name}\` of the application`,
                  `\`${server.application.name}\`. Regenerated at each change of the model: edit the`,
                  'model, not these files.',
                  '',
                  '## Run',
                  '',
                  `1. A MongoDB server: \`MONGO_URL\` names it (default: \`${mongoUrl}\`).`,
                  '2. `npm install`',
                  `3. \`npm start\` — the API listens on \`http://localhost:${server.port ?? 3000}\` (\`PORT\` changes it).`,
                  '',
                  '## Resources',
                  '',
                  ...resources.map((resource: any) =>
                    `- \`${pattern.routeOf(resource)}\` — ${resource.name}`)
                ]
              }
      - name: ModelToFile
        instanceOf: Core:Class
        icon: mui:Storage
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:mongoose.Model
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * ModelToFile — the Mongoose model of a model of the server (rule
               * 26), in `src/models/`: a schema with a field per field of its
               * collection —
               * - the type of rule 11, `required` when mandatory, an array when
               *   multiple, the values of an Enum in `enum`;
               * - the key of the collection `unique` and filled with a UUID at
               *   creation when it is absent;
               * - a reference of the collection as `ref` on the field that holds
               *   it.
               * `timestamps` when the model says so (Mongoose then writes
               * `createdAt` and `updatedAt`: the schema does not declare them
               * again), and `toJSON` without `_id` nor `__v`. The model is
               * exported by default under the name of the collection.
               */
              export default function (source) {
                const model: any = source
                const collection = model.collection
                if (!collection) {
                  throw new Error(`${model.name}: the model has no collection`)
                }
                const audit = model.timestamps ? ['createdAt', 'updatedAt'] : []
                const fields: any[] = (collection.fields ?? [])
                  .filter((field: any) => !audit.includes(field.name))
                const keyed = fields.includes(collection.key)
                const lines = [
                  ...(keyed ? ["import { randomUUID } from 'node:crypto'"] : []),
                  "import mongoose, { Schema } from 'mongoose'",
                  '',
                  'const schema = new Schema(',
                  '  {',
                  ...fields.map((field: any) => fieldOf(this, collection, field)),
                  '  },',
                  '  {',
                  `    collection: '${collection.name}',`,
                  ...(model.timestamps ? ['    timestamps: true,'] : []),
                  '    toJSON: {',
                  '      versionKey: false,',
                  '      transform: (_doc: unknown, ret: any) => {',
                  '        delete ret._id',
                  '        return ret',
                  '      },',
                  '    },',
                  '  },',
                  ')',
                  '',
                  `export default mongoose.model('${collection.name}', schema)`
                ]
                return new TypeScriptFile({
                  name: this.fileNameOf(this.pascalOf(model.name), 'ts'),
                  text: this.textOf(lines)
                })
              }

              /**
               * `clientId: { type: String, required: true, ref: 'Client' },` — the
               * line of a field in the schema. A field name is written as is: it
               * is the name of the field in the database.
               */
              function fieldOf(
                pattern: any,
                collection: any,
                field: any
              ): string {
                const type: any = field.type
                const values: string[] = Array.isArray(type?.values) ? type.values : []
                const references: any[] = collection.references ?? []
                const reference = references.find((r: any) => r.field === field)
                const options = [
                  `type: ${pattern.mongooseTypeOf(field)}`,
                  ...(field.mandatory ? ['required: true'] : []),
                  ...(values.length
                    ? [`enum: [${values.map((v: string) => `'${v}'`).join(', ')}]`]
                    : []),
                  ...(collection.key === field
                    ? ['unique: true', 'default: () => randomUUID()']
                    : []),
                  ...(reference?.target ? [`ref: '${reference.target.name}'`] : [])
                ]
                return `    ${keyOf(field.name)}: { ${options.join(', ')} },`
              }

              /** A property name, quoted when it is not an identifier. */
              function keyOf(name: string): string {
                return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name) ? name : `'${name}'`
              }
      - name: modelToFile
        instanceOf: NodeReactToCode:node.ModelToFile
        source: Node:mongoose.Model
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: nodeToCode
        instanceOf: NodeReactToCode:node.ServerToProject
        source: Node:express.Server
        target: FileSystem:SystemFolder
        outputRelation: FileSystem:EntryContainer.entries
      - name: ServiceToFile
        instanceOf: Core:Class
        icon: mui:SettingsSuggest
        extends:
          - NodeReactToCode:node.NodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:service.Service
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * ServiceToFile — the module of a Node service (rule 28), in
               * `src/services/`: it imports the models of the service and exports
               * a function per operation its routers serve, written with the model
               * of the collection named as the resource. The conversions between
               * a document and the payloads close the module: a field of a payload
               * matches the field of the same name of the collection, and only
               * the declared fields of an input payload are kept.
               */
              export default function (source) {
                const service: any = source
                const models: any[] = service.models ?? []
                const types = new Map<string, Set<string>>()
                const functions: string[][] = []
                const conversions = new Map<string, string[]>()
                for (const router of this.routersOf(service)) {
                  const part = partOf(this, router)
                  for (const endpoint of part.routed) {
                    functions.push(functionOf(this, part, endpoint, types))
                  }
                  addConversions(this, part, conversions)
                }
                const lines = [
                  ...models.map((model: any) => {
                    const file = this.pascalOf(model.name)
                    return `import ${file}Model from '../models/${file}.js'`
                  }),
                  ...[...types.entries()].map(([file, names]) => {
                    const list = [...names].join(', ')
                    return `import type { ${list} } from '../payloads/${file}.js'`
                  }),
                  ...functions.flatMap((f: string[]) => ['', ...f]),
                  ...[...conversions.values()].flatMap((c: string[]) => ['', ...c])
                ]
                return new TypeScriptFile({
                  name: this.fileNameOf(this.pascalOf(service.name), 'ts'),
                  text: this.textOf(lines.length ? lines : ['export {}'])
                })
              }

              /**
               * What the service does for one router: the endpoints it
               * implements, the model of the resource and its key.
               */
              function partOf(pattern: any, router: any): any {
                const model = pattern.modelOf(router)
                const collection = model?.collection
                return {
                  router,
                  routed: pattern.routedOf(router),
                  collection,
                  model: model ? `${pattern.pascalOf(model.name)}Model` : '',
                  payloadFile: pattern.pascalOf(router.resource.name),
                  key: collection?.key ? collection.key.name : '_id'
                }
              }

              /** The name of the type of a payload. */
              function typeOf(pattern: any, payload: any): string {
                return pattern.pascalOf(payload.name)
              }

              /** The filter on the key of the collection: `{ id }`. */
              function filterOf(part: any): string {
                return part.key === 'id' ? '{ id }' : `{ '${part.key}': id }`
              }

              /** The function of an operation (rule 28). */
              function functionOf(
                pattern: any,
                part: any,
                endpoint: any,
                types: Map<string, Set<string>>
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const name = pattern.serviceFunctionOf(part.router, operation)
                const out = endpoint.response ? typeOf(pattern, endpoint.response) : ''
                const input = endpoint.request ? typeOf(pattern, endpoint.request) : ''
                const used = types.get(part.payloadFile) ?? new Set<string>()
                for (const t of [out, input].filter((t: string) => t)) used.add(t)
                if (used.size) types.set(part.payloadFile, used)
                const model = part.model
                const filter = filterOf(part)
                if (operation === 'list') {
                  return [
                    `export async function ${name}(): Promise<${out}[]> {`,
                    `  const docs = await ${model}.find()`,
                    `  return docs.map(to${out})`,
                    '}'
                  ]
                }
                if (operation === 'get') {
                  return [
                    `export async function ${name}(id: string): Promise<${out} | null> {`,
                    `  const doc = await ${model}.findOne(${filter})`,
                    `  return doc ? to${out}(doc) : null`,
                    '}'
                  ]
                }
                if (operation === 'create') {
                  return [
                    `export async function ${name}(input: ${input}): Promise<${out}> {`,
                    `  const doc = await ${model}.create(from${input}(input))`,
                    `  return to${out}(doc)`,
                    '}'
                  ]
                }
                if (operation === 'update') {
                  return [
                    'export async function ' +
                      `${name}(id: string, input: ${input}): Promise<${out} | null> {`,
                    `  const doc = await ${model}.findOne(${filter})`,
                    '  if (!doc) return null',
                    `  doc.set(from${input}(input))`,
                    '  await doc.save()',
                    `  return to${out}(doc)`,
                    '}'
                  ]
                }
                return [
                  `export async function ${name}(id: string): Promise<boolean> {`,
                  `  const result = await ${model}.deleteOne(${filter})`,
                  '  return result.deletedCount > 0',
                  '}'
                ]
              }

              /**
               * Adds the conversions the functions of a router call, once each:
               * `to<Payload>` from a document for each response, `from<Payload>`
               * for each request.
               */
              function addConversions(
                pattern: any,
                part: any,
                conversions: Map<string, string[]>
              ): void {
                for (const endpoint of part.routed) {
                  const response = endpoint.response
                  const request = endpoint.request
                  if (response && !conversions.has(`to${typeOf(pattern, response)}`)) {
                    conversions.set(
                      `to${typeOf(pattern, response)}`,
                      toPayloadOf(pattern, part, response)
                    )
                  }
                  if (request && !conversions.has(`from${typeOf(pattern, request)}`)) {
                    conversions.set(
                      `from${typeOf(pattern, request)}`,
                      fromPayloadOf(pattern, part, request)
                    )
                  }
                }
              }

              /** The stored field a payload field matches (rule 12). */
              function fieldOf(part: any, field: any): any {
                const fields: any[] = part.collection?.fields ?? []
                return fields.find((f: any) => f.name === field.name)
              }

              /**
               * A field without a matching field is left out with a TODO in the
               * code and a warning in the log (rule 12).
               */
              function unmatched(part: any, payload: any, field: any): string {
                const collection = part.collection.name
                log.warning(
                  `${part.router.service.name}: ${payload.name}.${field.name} ` +
                  `matches no field of ${collection}`
                )
                return `// TODO: ${field.name} matches no field of ${collection}`
              }

              /** `doc.date`, or `doc[...]` for a name that is not plain. */
              function accessOf(target: string, name: string): string {
                const plain = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)
                return plain ? `${target}.${name}` : `${target}['${name}']`
              }

              /** `to<Payload>`: the payload of a document. */
              function toPayloadOf(
                pattern: any,
                part: any,
                payload: any
              ): string[] {
                const type = typeOf(pattern, payload)
                const fields: any[] = payload.fields ?? []
                let partial = false
                const values = fields.map((field: any) => {
                  const name = pattern.camelOf(field.name)
                  const stored = fieldOf(part, field)
                  if (!stored) {
                    partial = true
                    return `    ${unmatched(part, payload, field)}`
                  }
                  const value = accessOf('doc', stored.name)
                  const date = field.type?.name === 'Date' && !field.multiple
                  return `    ${name}: ${date ? `${value}?.toISOString()` : value},`
                })
                return [
                  `function to${type}(doc: any): ${type} {`,
                  '  return {',
                  ...values,
                  `  }${partial ? ` as ${type}` : ''}`,
                  '}'
                ]
              }

              /**
               * `from<Payload>`: the declared fields of an input payload, under the
               * names of the collection; the key is never taken from the input.
               */
              function fromPayloadOf(
                pattern: any,
                part: any,
                payload: any
              ): string[] {
                const type = typeOf(pattern, payload)
                const fields: any[] = payload.fields ?? []
                const values = fields.flatMap((field: any) => {
                  const stored = fieldOf(part, field)
                  if (!stored) return [`    ${unmatched(part, payload, field)}`]
                  if (stored === part.collection.key) return []
                  const key = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(stored.name)
                    ? stored.name
                    : `'${stored.name}'`
                  return [`    ${key}: ${accessOf('input', pattern.camelOf(field.name))},`]
                })
                return [
                  `function from${type}(input: ${type}) {`,
                  '  return {',
                  ...values,
                  '  }',
                  '}'
                ]
              }
      - name: RouterToFile
        instanceOf: Core:Class
        icon: mui:Http
        extends:
          - NodeReactToCode:node.NodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Router
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * RouterToFile — the Express router of a router of the server (rules
               * 29 and 10), in `src/routes/`: a route per endpoint it serves,
               * written with its service, errors passed to `next`, exported by
               * default for `src/index.ts`. An endpoint the service does not
               * implement — an operation the pattern does not know, a missing
               * payload, no model for the resource — answers 501 and the log says
               * why.
               */
              export default function (source) {
                const router: any = source
                const resource = router.resource
                if (!resource) {
                  throw new Error(`${router.name}: the router has no resource`)
                }
                if ((resource.payloads ?? []).length === 0) {
                  throw new Error(`${router.name}: ${resource.name} has no payload`)
                }
                const routed: any[] = this.routedOf(router)
                warnUnrouted(this, router, routed)
                const types = new Set<string>()
                const routes = (router.endpoints ?? []).map((endpoint: any) =>
                  routeOf(this, router, routed, endpoint, types))
                const service = router.service
                const lines = [
                  "import { Router } from 'express'",
                  ...(service && routed.length
                    ? [`import * as service from '../services/${this.pascalOf(service.name)}.js'`]
                    : []),
                  ...(types.size
                    ? [`import type { ${[...types].join(', ')} } from '../payloads/${this.pascalOf(resource.name)}.js'`]
                    : []),
                  '',
                  'const router = Router()',
                  ...routes.flatMap((route: string[]) => ['', ...route]),
                  '',
                  'export default router'
                ]
                return new TypeScriptFile({
                  name: this.fileNameOf(this.pascalOf(router.name), 'ts'),
                  text: this.textOf(lines)
                })
              }

              /**
               * The log says once why the service implements none of the
               * endpoints: no service, or no model for the resource.
               */
              function warnUnrouted(
                pattern: any,
                router: any,
                routed: any[]
              ): void {
                if ((router.endpoints ?? []).length === 0 || routed.length) return
                if (!router.service) {
                  log.warning(`${router.name}: no service, every endpoint answers 501`)
                } else if (!pattern.modelOf(router)) {
                  log.warning(
                    `${router.name}: ${router.service.name} has no model ` +
                    `for ${router.resource.name}, every endpoint answers 501`
                  )
                }
              }

              /** `router.get('/:id', async (req, res, next) => {` */
              function openOf(pattern: any, endpoint: any): string {
                const method = String(endpoint.method ?? 'GET').toLowerCase()
                const path = pattern.expressPathOf(endpoint)
                return `router.${method}('${path}', async (req, res, next) => {`
              }

              /** The route of an endpoint. */
              function routeOf(
                pattern: any,
                router: any,
                routed: any[],
                endpoint: any,
                types: Set<string>
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const implemented = routed
                  .find((e: any) => pattern.operationOf(e) === operation)
                if (!implemented) {
                  return notImplementedOf(pattern, router, endpoint)
                }
                const out = implemented.response
                  ? pattern.pascalOf(implemented.response.name) : ''
                const input = implemented.request
                  ? pattern.pascalOf(implemented.request.name) : ''
                if (input) types.add(input)
                const call = `service.${pattern.serviceFunctionOf(router, operation)}`
                const id = idOf(endpoint)
                const body = [
                  ...(operation === 'list'
                    ? [`    res.json(await ${call}())`] : []),
                  ...(operation === 'get' ? found(`await ${call}(${id})`) : []),
                  ...(operation === 'create'
                    ? [
                        `    const created = await ${call}(req.body as ${input})`,
                        '    res.status(201).json(created)'
                      ]
                    : []),
                  ...(operation === 'update'
                    ? found(`await ${call}(${id}, req.body as ${input})`)
                    : []),
                  ...(operation === 'delete'
                    ? [
                        `    if (await ${call}(${id})) {`,
                        '      res.status(204).end()',
                        '    } else {',
                        '      res.status(404).end()',
                        '    }'
                      ]
                    : [])
                ]
                return [
                  openOf(pattern, endpoint),
                  '  try {',
                  ...body,
                  '  } catch (error) {',
                  '    next(error)',
                  '  }',
                  '})'
                ]
              }

              /** `req.params.id` for a path `/{id}`. */
              function idOf(endpoint: any): string {
                const match = /\{([^}]+)\}/.exec(String(endpoint.path ?? ''))
                const name = match ? match[1] : 'id'
                return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)
                  ? `req.params.${name}`
                  : `req.params['${name}']`
              }

              /** The found payload in JSON, or 404. */
              function found(call: string): string[] {
                return [
                  `    const found = ${call}`,
                  '    if (found) {',
                  '      res.json(found)',
                  '    } else {',
                  '      res.status(404).end()',
                  '    }'
                ]
              }

              /**
               * The route of an endpoint the service does not implement: it
               * answers 501 (rule 10). An unknown operation or a missing payload
               * is said in the log.
               */
              function notImplementedOf(
                pattern: any,
                router: any,
                endpoint: any
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const route = `${endpoint.method} ${endpoint.path ?? ''}`.trim()
                const why = operation === 'unknown'
                  ? 'is no operation the pattern knows'
                  : 'has no implementation in the service'
                if (operation === 'unknown') {
                  log.warning(`${router.name}: ${route} ${why}, it answers 501`)
                } else if (pattern.modelOf(router)) {
                  log.warning(
                    `${router.name}: ${endpoint.name} lacks the payload ` +
                    `its operation needs, it answers 501`
                  )
                }
                const method = String(endpoint.method ?? 'GET').toLowerCase()
                const path = pattern.expressPathOf(endpoint)
                return [
                  `router.${method}('${path}', (_req, res) => {`,
                  `  // TODO: ${route} ${why}`,
                  '  res.status(501).end()',
                  '})'
                ]
              }
      - name: serviceToFile
        instanceOf: NodeReactToCode:node.ServiceToFile
        source: Node:service.Service
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: routerToFile
        instanceOf: NodeReactToCode:node.RouterToFile
        source: Node:express.Router
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
  - name: react
    instanceOf: Core:Package
    elements:
      - name: FrontendToProject
        instanceOf: Core:Class
        icon: thesvg:react
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: apiUrl
            instanceOf: Core:PrimitiveProperty
            type: Core:String
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: React:Frontend
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import {
                CssFile,
                Folder,
                HtmlFile,
                MarkdownFile,
                TextFile,
                TypeScriptFile
              } from 'FileSystem'
              import {
                apiClientToFile,
                layoutToFile,
                pageComponentToFile
              } from 'NodeReactToCode/react'
              import { resourceToPayloadTypes } from 'ApplicationToCode/code'

              /**
               * FrontendToProject — the head pattern of a React client (rules 2,
               * 5 and 6). Branched on a React frontend, it writes a Vite + React +
               * TypeScript project in a system folder:
               * - `package.json`, `tsconfig.json`, `vite.config.ts` (the dev
               *   server on port 5173, the base path of each API proxied to the
               *   option `apiUrl`), `index.html`, `.gitignore` and `README.md`;
               * - under `src/`: `main.tsx`, `App.tsx` (a route per route of the
               *   frontend, all rendered in the layout), `styles.css`, the layout
               *   (LayoutToFile), a file per page component (PageComponentToFile),
               *   an API client per service (ApiClientToFile) and the types of
               *   the payloads of each resource they call (ResourceToPayloadTypes).
               * A page without page component, a route to a component of another
               * frontend or a client without resource is an error on the Mapping.
               * A relative import names no extension: Vite resolves it.
               */
              export default function (source) {
                const frontend: any = source
                if (!frontend.application) {
                  throw new Error(`${frontend.name}: the frontend has no application`)
                }
                const routes: any[] = frontend.routes ?? []
                routes.forEach((route: any) => checkRoute(frontend, route))
                const components: any[] = frontend.components ?? []
                const layout = components.find((c: any) =>
                  c.instanceOf?._inherits(e('Application:spa.Layout')))
                if (!layout) log.warning(`${frontend.name}: no layout`)
                const pageComponents = components.filter((c: any) =>
                  c.instanceOf?._inherits(e('Application:spa.PageComponent')))
                checkPages(frontend, pageComponents)
                const services: any[] = frontend.services ?? []
                const resources = services
                  .map((service: any) => service.resource)
                  .filter((r: any, i: number, all: any[]) => r && all.indexOf(r) === i)
                const apiUrl = this.apiUrl || 'http://localhost:3000'
                const basePaths = basePathsOf(frontend)
                const textFile = (name: string, ext: string, fileType: string, lines: string[]) =>
                  new TextFile({
                    name: this.fileNameOf(name, ext),
                    fileType,
                    text: this.textOf(lines)
                  })
                return [
                  textFile('package', 'json', 'json', packageOf(this, frontend)),
                  textFile('tsconfig', 'json', 'json', TSCONFIG),
                  new TypeScriptFile({
                    name: this.fileNameOf('vite__config', 'ts'),
                    text: this.textOf(viteConfigOf(basePaths, apiUrl))
                  }),
                  new HtmlFile({
                    name: this.fileNameOf('index', 'html'),
                    text: this.textOf(indexHtmlOf(frontend))
                  }),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist']),
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(this, frontend, basePaths, apiUrl))
                  }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new TypeScriptFile({
                        name: this.fileNameOf('main', 'tsx'),
                        text: this.textOf(MAIN)
                      }),
                      new TypeScriptFile({
                        name: this.fileNameOf('App', 'tsx'),
                        text: this.textOf(appOf(this, routes, layout))
                      }),
                      new CssFile({
                        name: this.fileNameOf('styles', 'css'),
                        text: this.textOf(STYLES)
                      }),
                      new Folder({
                        name: 'components',
                        entries: layout ? [map(layout, layoutToFile)] : []
                      }),
                      new Folder({
                        name: 'pages',
                        entries: pageComponents
                          .map((c: any) => map(c, pageComponentToFile))
                      }),
                      new Folder({
                        name: 'api',
                        entries: services.map((s: any) => map(s, apiClientToFile))
                      }),
                      new Folder({
                        name: 'types',
                        entries: resources
                          .map((r: any) => map(r, resourceToPayloadTypes))
                      })
                    ]
                  })
                ]
              }

              /**
               * A route leads to a page component of its own frontend (rule 4):
               * any other route is an error on the Mapping.
               */
              function checkRoute(frontend: any, route: any): void {
                const component = route.component
                if (!component) {
                  throw new Error(`${route.name}: the route has no component`)
                }
                if (component.frontend !== frontend) {
                  const owner = component.frontend?.name ?? 'no frontend'
                  throw new Error(
                    `${route.name}: ${component.name} belongs to ${owner}`)
                }
              }

              /**
               * Each page of the frontend has a page component (rule 4): a page
               * without one is an error on the Mapping.
               */
              function checkPages(frontend: any, pageComponents: any[]): void {
                const pages: any[] = frontend.pages ?? []
                for (const page of pages) {
                  if (pageComponents.some((c: any) => c.page === page)) continue
                  throw new Error(`${page.name}: the page has no page component`)
                }
              }

              /**
               * The lines of `tsconfig.json`: strict, JSX by React, modules
               * resolved by the bundler, the types of Vite.
               */
              const TSCONFIG = [
                '{',
                '  "compilerOptions": {',
                '    "target": "ES2022",',
                '    "lib": ["ES2022", "DOM", "DOM.Iterable"],',
                '    "module": "ESNext",',
                '    "moduleResolution": "bundler",',
                '    "jsx": "react-jsx",',
                '    "strict": true,',
                '    "noEmit": true,',
                '    "isolatedModules": true,',
                '    "skipLibCheck": true,',
                '    "types": ["vite/client"]',
                '  },',
                '  "include": ["src"]',
                '}'
              ]

              /** The lines of `package.json`, versions pinned (rule 5). */
              function packageOf(pattern: any, frontend: any): string[] {
                const name = pattern.kebabOf(frontend.application.name)
                return [
                  '{',
                  `  "name": "${name}-client",`,
                  '  "version": "0.1.0",',
                  '  "private": true,',
                  '  "type": "module",',
                  '  "scripts": {',
                  '    "start": "vite",',
                  '    "build": "tsc --noEmit && vite build",',
                  '    "typecheck": "tsc --noEmit"',
                  '  },',
                  '  "dependencies": {',
                  '    "react": "19.1.10",',
                  '    "react-dom": "19.1.10",',
                  '    "react-router": "7.1.5"',
                  '  },',
                  '  "devDependencies": {',
                  '    "@types/react": "19.1.17",',
                  '    "@types/react-dom": "19.1.11",',
                  '    "@vitejs/plugin-react": "4.3.4",',
                  '    "typescript": "5.7.3",',
                  '    "vite": "6.0.15"',
                  '  }',
                  '}'
                ]
              }

              /**
               * The base paths the client calls: the base path of each API of the
               * application, once each, `/api` when none says.
               */
              function basePathsOf(frontend: any): string[] {
                const apis: any[] = frontend.application.apis ?? []
                const paths = apis
                  .map((api: any) => String(api.basePath ?? '').replace(/\/+$/, ''))
                  .filter((p: string, i: number, all: string[]) =>
                    p !== '' && all.indexOf(p) === i)
                if (paths.length === 0) {
                  log.warning(`${frontend.name}: no API base path, /api proxied`)
                  return ['/api']
                }
                return paths
              }

              /**
               * The lines of `vite.config.ts`: React, the dev server on port 5173
               * and each base path of the API proxied to `apiUrl`, so the client
               * calls the server without CORS.
               */
              function viteConfigOf(
                basePaths: string[],
                apiUrl: string
              ): string[] {
                return [
                  "import { defineConfig } from 'vite'",
                  "import react from '@vitejs/plugin-react'",
                  '',
                  'export default defineConfig({',
                  '  plugins: [react()],',
                  '  server: {',
                  '    port: 5173,',
                  '    proxy: {',
                  ...basePaths.map((path: string, i: number, all: string[]) =>
                    `      '${path}': '${apiUrl}'${i < all.length - 1 ? ',' : ''}`),
                  '    }',
                  '  }',
                  '})'
                ]
              }

              /** The title of the application: its title, else its name. */
              function titleOf(frontend: any): string {
                return frontend.application.title || frontend.application.name
              }

              /** The lines of `index.html`: the root and the entry module. */
              function indexHtmlOf(frontend: any): string[] {
                return [
                  '<!doctype html>',
                  '<html lang="en">',
                  '  <head>',
                  '    <meta charset="UTF-8" />',
                  '    <meta name="viewport" content="width=device-width, initial-scale=1.0" />',
                  `    <title>${titleOf(frontend)}</title>`,
                  '  </head>',
                  '  <body>',
                  '    <div id="root"></div>',
                  '    <script type="module" src="/src/main.tsx"></script>',
                  '  </body>',
                  '</html>'
                ]
              }

              /**
               * The lines of `src/main.tsx`: the application mounted in `#root`
               * with the router of the browser.
               */
              const MAIN = [
                "import { StrictMode } from 'react'",
                "import { createRoot } from 'react-dom/client'",
                "import { BrowserRouter } from 'react-router'",
                "import App from './App'",
                "import './styles.css'",
                '',
                "createRoot(document.getElementById('root')!).render(",
                '  <StrictMode>',
                '    <BrowserRouter>',
                '      <App />',
                '    </BrowserRouter>',
                '  </StrictMode>',
                ')'
              ]

              /**
               * The lines of `src/App.tsx`: a route per route of the frontend,
               * its path as the model says, its page component imported from
               * `./pages/`, all of them rendered in the layout. The index route
               * shows the layout alone, so `/` opens on the menu. Without a
               * layout the routes render in an empty frame.
               */
              function appOf(
                pattern: any,
                routes: any[],
                layout: any
              ): string[] {
                const components = routes
                  .map((route: any) => pattern.pascalOf(route.component.name))
                  .filter((c: string, i: number, all: string[]) => all.indexOf(c) === i)
                const frame = layout ? pattern.pascalOf(layout.name) : undefined
                return [
                  `import { ${frame ? '' : 'Outlet, '}Route, Routes } from 'react-router'`,
                  ...(frame ? [`import ${frame} from './components/${frame}'`] : []),
                  ...components.map((c: string) => `import ${c} from './pages/${c}'`),
                  '',
                  'export default function App() {',
                  '  return (',
                  '    <Routes>',
                  `      <Route element={<${frame ?? 'Outlet'} />}>`,
                  '        <Route index element={null} />',
                  ...routes.map((route: any) => {
                    const c = pattern.pascalOf(route.component.name)
                    return `        <Route path="${route.path}" element={<${c} />} />`
                  }),
                  '      </Route>',
                  '    </Routes>',
                  '  )',
                  '}'
                ]
              }

              /**
               * The lines of `src/styles.css`: the layout of the client, no
               * component library (rule 7). The bar marks the open page (the
               * `active` class of NavLink), each page is a card, a list a full
               * width table, a detail a grid of labels and values, a form a
               * column of labelled controls; the link `New` is the main button,
               * the links of a detail are secondary, `Delete` is red.
               */
              const STYLES = [
                ':root {',
                '  --primary: #1565c0;',
                '  --danger: #c62828;',
                '  --text: #1f2933;',
                '  --muted: #5f6b7a;',
                '  --border: #dde1e6;',
                '  --background: #f4f6f8;',
                '}',
                '',
                '* {',
                '  box-sizing: border-box;',
                '}',
                '',
                'body {',
                '  margin: 0;',
                '  font-family: system-ui, "Segoe UI", Roboto, sans-serif;',
                '  line-height: 1.5;',
                '  color: var(--text);',
                '  background: var(--background);',
                '}',
                '',
                'a {',
                '  color: var(--primary);',
                '}',
                '',
                'nav {',
                '  position: sticky;',
                '  top: 0;',
                '  z-index: 1;',
                '  display: flex;',
                '  flex-wrap: wrap;',
                '  gap: 0.25rem;',
                '  align-items: center;',
                '  padding: 0.5rem 1.5rem;',
                '  color: #fff;',
                '  background: #37474f;',
                '  box-shadow: 0 2px 4px rgb(0 0 0 / 20%);',
                '}',
                '',
                'nav strong {',
                '  margin-right: 1.5rem;',
                '  font-size: 1.25rem;',
                '}',
                '',
                'nav a {',
                '  padding: 0.375rem 0.75rem;',
                '  border-radius: 4px;',
                '  color: inherit;',
                '  text-decoration: none;',
                '  opacity: 0.85;',
                '}',
                '',
                'nav a:hover {',
                '  background: rgb(255 255 255 / 12%);',
                '  opacity: 1;',
                '}',
                '',
                'nav a.active {',
                '  font-weight: 600;',
                '  background: rgb(255 255 255 / 20%);',
                '  opacity: 1;',
                '}',
                '',
                'main {',
                '  max-width: 1100px;',
                '  margin: 0 auto;',
                '  padding: 2rem 1.5rem;',
                '}',
                '',
                'section {',
                '  padding: 1.5rem 2rem;',
                '  border: 1px solid var(--border);',
                '  border-radius: 8px;',
                '  background: #fff;',
                '  box-shadow: 0 1px 2px rgb(0 0 0 / 6%);',
                '}',
                '',
                'h1 {',
                '  margin: 0 0 1.25rem;',
                '  font-size: 1.5rem;',
                '  font-weight: 600;',
                '}',
                '',
                'table {',
                '  width: 100%;',
                '  margin-top: 1.25rem;',
                '  border-collapse: collapse;',
                '}',
                '',
                'th,',
                'td {',
                '  padding: 0.625rem 0.75rem;',
                '  border-bottom: 1px solid var(--border);',
                '  text-align: left;',
                '}',
                '',
                'th {',
                '  font-size: 0.8125rem;',
                '  font-weight: 600;',
                '  letter-spacing: 0.02em;',
                '  text-transform: uppercase;',
                '  color: var(--muted);',
                '  background: #f8f9fb;',
                '}',
                '',
                'tbody tr:hover {',
                '  background: #f1f5fb;',
                '}',
                '',
                'dl {',
                '  display: grid;',
                '  grid-template-columns: max-content 1fr;',
                '  gap: 0.625rem 2rem;',
                '  margin: 0 0 1.5rem;',
                '}',
                '',
                'dt {',
                '  font-weight: 600;',
                '  color: var(--muted);',
                '}',
                '',
                'dd {',
                '  margin: 0;',
                '}',
                '',
                'form {',
                '  display: grid;',
                '  gap: 1rem;',
                '  max-width: 32rem;',
                '}',
                '',
                'form label {',
                '  display: grid;',
                '  gap: 0.25rem;',
                '  font-weight: 600;',
                '}',
                '',
                'form input,',
                'form select,',
                'form textarea {',
                '  width: 100%;',
                '  padding: 0.5rem 0.625rem;',
                '  border: 1px solid #c3cad3;',
                '  border-radius: 4px;',
                '  font: inherit;',
                '  font-weight: normal;',
                '  background: #fff;',
                '}',
                '',
                'form input[type="checkbox"] {',
                '  justify-self: start;',
                '  width: auto;',
                '}',
                '',
                'form input:focus,',
                'form select:focus,',
                'form textarea:focus {',
                '  border-color: var(--primary);',
                '  outline: 2px solid var(--primary);',
                '  outline-offset: -1px;',
                '}',
                '',
                'button,',
                'section > a,',
                'section > p > a {',
                '  display: inline-block;',
                '  padding: 0.5rem 1rem;',
                '  border: 1px solid var(--primary);',
                '  border-radius: 4px;',
                '  font: inherit;',
                '  font-weight: 600;',
                '  line-height: 1.25;',
                '  text-decoration: none;',
                '  cursor: pointer;',
                '}',
                '',
                'button,',
                'section > a {',
                '  color: #fff;',
                '  background: var(--primary);',
                '}',
                '',
                'button:hover,',
                'section > a:hover {',
                '  filter: brightness(0.9);',
                '}',
                '',
                'form button {',
                '  justify-self: start;',
                '}',
                '',
                'section > p:not(.error) {',
                '  display: flex;',
                '  flex-wrap: wrap;',
                '  gap: 0.75rem;',
                '  margin: 0;',
                '}',
                '',
                'section > p > a {',
                '  color: var(--primary);',
                '  background: transparent;',
                '}',
                '',
                'section > p > a:hover {',
                '  background: #e8f0fb;',
                '}',
                '',
                'section > p > button {',
                '  margin-left: auto;',
                '  border-color: var(--danger);',
                '  color: var(--danger);',
                '  background: transparent;',
                '}',
                '',
                'section > p > button:hover {',
                '  filter: none;',
                '  background: #fdecea;',
                '}',
                '',
                '.error {',
                '  padding: 0.75rem 1rem;',
                '  border: 1px solid #f5c2c0;',
                '  border-radius: 4px;',
                '  color: var(--danger);',
                '  background: #fdecea;',
                '}'
              ]

              /** The lines of `README.md`: how to run the client alone. */
              function readmeOf(
                pattern: any,
                frontend: any,
                basePaths: string[],
                apiUrl: string
              ): string[] {
                const services: any[] = frontend.services ?? []
                const forwarded = basePaths.map((p: string) => `\`${p}\``)
                return [
                  `# ${titleOf(frontend)} — React`,
                  '',
                  `Generated from the React frontend \`${frontend.name}\` of the application`,
                  `\`${frontend.application.name}\`. Regenerated at each change of the model: edit the`,
                  'model, not these files.',
                  '',
                  '## Run',
                  '',
                  `1. The API server, listening on \`${apiUrl}\`.`,
                  '2. `npm install`',
                  '3. `npm start` — the client opens on `http://localhost:5173`; Vite',
                  `   forwards ${forwarded.join(', ')} to the API server.`,
                  '',
                  '`npm run typecheck` checks the types, `npm run build` writes the',
                  'client under `dist/`.',
                  '',
                  '## API clients',
                  '',
                  ...services.map((service: any) => {
                    const route = service.resource
                      ? pattern.routeOf(service.resource)
                      : '—'
                    return `- \`src/api/${pattern.pascalOf(service.name)}.ts\` — \`${route}\``
                  })
                ]
              }
      - name: ApiClientToFile
        instanceOf: Core:Class
        icon: mui:CloudSync
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: React:ApiClient
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * ApiClientToFile — the API client of a React frontend (rule 10), in
               * `src/api/`: a function per endpoint the client serves, named after
               * its operation (`list` · `get` · `create` · `update` · `remove`).
               * Each one calls `fetch` on the route of the resource and the path
               * of the endpoint, sends and reads JSON, and throws an error with
               * the status and the body of a response that is not 2xx. An endpoint
               * of an unknown operation, or a second one of the same operation, is
               * skipped with a warning.
               */
              export default function (source) {
                const client: any = source
                const resource: any = client.resource
                if (!resource) {
                  throw new Error(`${client.name}: the API client has no resource`)
                }
                const endpoints = servedOf(this, client)
                const types = typesOf(this, endpoints)
                const typeFile = this.pascalOf(resource.name)
                return new TypeScriptFile({
                  name: this.fileNameOf(this.pascalOf(client.name), 'ts'),
                  text: this.textOf([
                    ...(types.length > 0
                      ? [`import type { ${types.join(', ')} } from '../types/${typeFile}'`, '']
                      : []),
                    `const route = '${this.routeOf(resource)}'`,
                    '',
                    ...REQUEST,
                    ...endpoints.flatMap((endpoint: any) =>
                      ['', ...functionOf(this, endpoint)])
                  ])
                })
              }

              /** The function of an operation: `delete` is a reserved word. */
              const FUNCTION_NAMES: Record<string, string> = {
                list: 'list',
                get: 'get',
                create: 'create',
                update: 'update',
                delete: 'remove'
              }

              /**
               * The lines of `request`, the one helper of a client: JSON in and
               * out, an error with the status and the body when the response is
               * not 2xx, nothing to read from an empty body (a 204).
               */
              const REQUEST = [
                'async function request<T>(path: string, init?: RequestInit): Promise<T> {',
                '  const response = await fetch(path, {',
                "    headers: { 'Content-Type': 'application/json' },",
                '    ...init',
                '  })',
                '  const body = await response.text()',
                '  if (!response.ok) {',
                '    throw new Error(`${response.status} ${response.statusText}: ${body}`)',
                '  }',
                '  return (body ? JSON.parse(body) : undefined) as T',
                '}'
              ]

              /**
               * The endpoints the client serves: the first one of each known
               * operation, in the order of the model.
               */
              function servedOf(pattern: any, client: any): any[] {
                const seen = new Set<string>()
                const endpoints: any[] = client.endpoints ?? []
                return endpoints.filter((endpoint: any) => {
                  const operation = pattern.operationOf(endpoint)
                  if (operation === 'unknown') {
                    const what = `${endpoint.method} ${endpoint.path ?? ''}`
                    log.warning(`${client.name}: ${what} has no known operation, skipped`)
                    return false
                  }
                  if (seen.has(operation)) {
                    log.warning(`${client.name}: a second ${operation} endpoint, skipped`)
                    return false
                  }
                  seen.add(operation)
                  return true
                })
              }

              /** The payload types the functions name, once each. */
              function typesOf(pattern: any, endpoints: any[]): string[] {
                const names = endpoints
                  .flatMap((endpoint: any) => [endpoint.request, endpoint.response])
                  .filter((payload: any) => !!payload)
                  .map((payload: any) => pattern.pascalOf(payload.name))
                return names.filter((name: string, i: number) => names.indexOf(name) === i)
              }

              /** The path parameters of an endpoint, in their order. */
              function parametersOf(endpoint: any): string[] {
                const path = String(endpoint.path ?? '')
                return [...path.matchAll(/\{([^}]+)\}/g)].map((m: any) => m[1])
              }

              /**
               * The URL expression of an endpoint: the route of the resource,
               * then its path with each `{parameter}` encoded.
               */
              function urlOf(pattern: any, endpoint: any): string {
                const path = String(endpoint.path ?? '').replace(/\/+$/, '')
                if (path === '') return 'route'
                const filled = path.replace(/\{([^}]+)\}/g, (_: string, p: string) =>
                  `\${encodeURIComponent(${pattern.camelOf(p)})}`)
                return `\`\${route}${filled.startsWith('/') ? '' : '/'}${filled}\``
              }

              /** The type a function resolves to. */
              function resultOf(pattern: any, endpoint: any): string {
                if (!endpoint.response) return 'void'
                const type = pattern.pascalOf(endpoint.response.name)
                const many =
                  endpoint.returnsList || pattern.operationOf(endpoint) === 'list'
                return many ? `${type}[]` : type
              }

              /** The lines of the function of an endpoint. */
              function functionOf(pattern: any, endpoint: any): string[] {
                const name = FUNCTION_NAMES[pattern.operationOf(endpoint)]
                const params = parametersOf(endpoint)
                  .map((p: string) => `${pattern.camelOf(p)}: string`)
                const request = endpoint.request
                  ? pattern.pascalOf(endpoint.request.name)
                  : undefined
                if (request) params.push(`input: ${request}`)
                const method = String(endpoint.method ?? 'GET').toUpperCase()
                const init = [
                  ...(method === 'GET' ? [] : [`method: '${method}'`]),
                  ...(request ? ['body: JSON.stringify(input)'] : [])
                ]
                const url = urlOf(pattern, endpoint)
                const result = resultOf(pattern, endpoint)
                const call = `return request<${result}>(${url}`
                const body = init.length === 0
                  ? [`  ${call})`]
                  : [
                      `  ${call}, {`,
                      ...init.map((line: string, i: number) =>
                        `    ${line}${i < init.length - 1 ? ',' : ''}`),
                      '  })'
                    ]
                return [
                  `export function ${name}(${params.join(', ')}): Promise<${result}> {`,
                  ...body,
                  '}'
                ]
              }
      - name: apiClientToFile
        instanceOf: NodeReactToCode:react.ApiClientToFile
        source: React:ApiClient
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: reactToCode
        instanceOf: NodeReactToCode:react.FrontendToProject
        source: React:Frontend
        target: FileSystem:SystemFolder
        outputRelation: FileSystem:EntryContainer.entries
      - name: LayoutToFile
        instanceOf: Core:Class
        icon: mui:ViewQuilt
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Application:spa.Layout
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * LayoutToFile — the layout of a React frontend (rule 7), in
               * `src/components/`: the navigation bar with the title and the color
               * of its Navbar child and a NavLink per menu entry of the frontend to
               * the route of its page, then the current page below (`<Outlet />`).
               * No component library: HTML and the rules of `styles.css`.
               */
              export default function (source) {
                const layout: any = source
                const frontend: any = layout.frontend
                const children: any[] = layout.children ?? []
                const navbar = children.find((child: any) =>
                  child.instanceOf?._inherits(e('Application:spa.Navbar')))
                const menu: any[] = frontend?.menu ?? []
                return new TypeScriptFile({
                  name: this.fileNameOf(this.pascalOf(layout.name), 'tsx'),
                  text: this.textOf([
                    "import { NavLink, Outlet } from 'react-router'",
                    '',
                    `export default function ${this.pascalOf(layout.name)}() {`,
                    '  return (',
                    '    <>',
                    ...navLines(navbar, menu),
                    '      <main>',
                    '        <Outlet />',
                    '      </main>',
                    '    </>',
                    '  )',
                    '}'
                  ])
                })
              }

              /**
               * A text in JSX: as is when it holds no character JSX reads, else
               * a string expression.
               */
              function jsxText(text: string): string {
                return /^[^{}<>&]*$/.test(text) ? text : `{${JSON.stringify(text)}}`
              }

              /** The bar: its color, its title, a link per menu entry. */
              function navLines(navbar: any, menu: any[]): string[] {
                const color = navbar?.color
                  ? ` style={{ background: ${JSON.stringify(navbar.color)} }}`
                  : ''
                const links = menu.filter((entry: any) => {
                  if (entry.page?.route) return true
                  log.warning(`${entry.name}: the menu entry has no page route`)
                  return false
                })
                return [
                  `      <nav${color}>`,
                  ...(navbar?.title
                    ? [`        <strong>${jsxText(navbar.title)}</strong>`]
                    : []),
                  ...links.map((entry: any) => {
                    const to = JSON.stringify(entry.page.route)
                    const label = jsxText(entry.label ?? entry.name)
                    return `        <NavLink to=${to}>${label}</NavLink>`
                  }),
                  '      </nav>'
                ]
              }
      - name: PageComponentToFile
        instanceOf: Core:Class
        icon: mui:Article
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Application:spa.PageComponent
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * PageComponentToFile — a page component of a React frontend (rules
               * 8, 9 and 12), in `src/pages/`. What it renders depends on its
               * child:
               * - a Table: a column per field of the page, a row per element that
               *   `list` returns, each row a link to its `rowLink` page, and a
               *   « New » link to the creation form of the resource;
               * - a Detail: the element `get` reads, a line per field, the links
               *   of the page and a « Delete » button when the client serves the
               *   deletion;
               * - a Form: a control per field, filled by `get` when the route has
               *   an identifier, sent by `create` or `update`, then the detail.
               * A page whose API client lacks the operation it needs shows « Not
               * available » and writes a warning.
               */
              export default function (source) {
                const component: any = source
                const page: any = component.page
                if (!page) {
                  throw new Error(`${component.name}: the component has no page`)
                }
                const ctx = contextOf(this, component, page)
                const lines = !ctx.child
                  ? notAvailable(ctx, 'no table, detail or form')
                  : ctx.kind === 'table' ? tableLines(ctx)
                  : ctx.kind === 'detail' ? detailLines(ctx)
                  : formLines(ctx)
                return new TypeScriptFile({
                  name: this.fileNameOf(ctx.name, 'tsx'),
                  text: this.textOf(lines)
                })
              }

              /** Whether an element is an instance of a class or a subclass. */
              function isA(element: any, path: string): boolean {
                return !!element?.instanceOf?._inherits(e(path))
              }

              /** The kind of a child: `table`, `detail`, `form` or none. */
              function kindOf(child: any): string | undefined {
                if (isA(child, 'Application:spa.Table')) return 'table'
                if (isA(child, 'Application:spa.Detail')) return 'detail'
                if (isA(child, 'Application:spa.Form')) return 'form'
                return undefined
              }

              /**
               * The endpoints a client serves by operation: the first one of each
               * known operation, as ApiClientToFile writes them.
               */
              function operationsOf(
                pattern: any,
                client: any
              ): Map<string, any> {
                const served = new Map<string, any>()
                for (const endpoint of client?.endpoints ?? []) {
                  const operation = pattern.operationOf(endpoint)
                  if (operation === 'unknown' || served.has(operation)) continue
                  served.set(operation, endpoint)
                }
                return served
              }

              /** The names of the parameters of a route (`:id` gives `id`). */
              function paramsOf(route: string): string[] {
                return [...String(route ?? '').matchAll(/:(\w+)/g)]
                  .map((m: any) => m[1])
              }

              /**
               * What every rendering reads: the component, its page and frontend,
               * its child and its kind, the API client of the resource and the
               * operations it serves, the payload type and the fields of the page
               * that the payload carries.
               */
              function contextOf(pattern: any, component: any, page: any): any {
                const frontend: any = component.frontend ?? page.frontend
                const child = (component.children ?? [])
                  .find((c: any) => kindOf(c) !== undefined)
                const payload: any = child?.payload
                const resource: any = page.resource ?? payload?.resource
                const client = pattern.apiClientOf(frontend, resource)
                const carried = new Set((payload?.fields ?? [])
                  .map((f: any) => pattern.camelOf(f.name)))
                const name = pattern.pascalOf(component.name)
                const fields = (page.fields ?? []).filter((field: any) => {
                  if (carried.has(pattern.camelOf(field.name))) return true
                  log.warning(`${name}: ${field.name} is not in the payload`)
                  return false
                })
                return {
                  pattern, component, page, frontend, child, payload, resource,
                  client, fields, name,
                  kind: kindOf(child),
                  ops: operationsOf(pattern, client),
                  api: client ? pattern.pascalOf(client.name) : undefined,
                  type: payload ? pattern.pascalOf(payload.name) : undefined,
                  typeFile: resource ? pattern.pascalOf(resource.name) : undefined,
                  params: paramsOf(page.route)
                }
              }

              /** A text in JSX: as is, or a string expression when it must. */
              function jsxText(text: string): string {
                return /^[^{}<>&]*$/.test(text) ? text : `{${JSON.stringify(text)}}`
              }

              /**
               * The expression of a route: a string, or a template whose
               * parameters come from `valueOf` (`/commandes/:id` and `item.id`
               * give `` `/commandes/${item.id}` ``).
               */
              function routeOf(route: string, valueOf: (p: string) => string) {
                if (paramsOf(route).length === 0) return JSON.stringify(route)
                const filled = route.replace(/:(\w+)/g, (_: string, p: string) =>
                  `\${${valueOf(p)}}`)
                return `\`${filled}\``
              }

              /** The `to` attribute of a link to a route. */
              function linkTo(route: string, valueOf: (p: string) => string) {
                const expression = routeOf(route, valueOf)
                return expression.startsWith('"') ? expression : `{${expression}}`
              }

              /** The pages of the frontend for the resource of a context. */
              function siblingsOf(ctx: any, kind: string): any[] {
                const pages: any[] = ctx.frontend?.pages ?? []
                return pages.filter((page: any) =>
                  page.kind === kind && page.resource === ctx.resource)
              }

              /** The creation page: a form with no parameter. */
              function creationOf(ctx: any): any {
                return siblingsOf(ctx, 'form')
                  .find((page: any) => paramsOf(page.route).length === 0)
              }

              /** The lines of a page that cannot work, with a warning. */
              function notAvailable(ctx: any, why: string): string[] {
                log.warning(`${ctx.name}: ${why}, the page is not available`)
                return [
                  `export default function ${ctx.name}() {`,
                  '  return (',
                  '    <section>',
                  `      <h1>${jsxText(ctx.page.title)}</h1>`,
                  '      <p>Not available</p>',
                  '    </section>',
                  '  )',
                  '}'
                ]
              }

              /** The imports of the API client and of the payload types. */
              function importLines(ctx: any, types: string[]): string[] {
                return [
                  `import * as ${ctx.api} from '../api/${ctx.api}'`,
                  `import type { ${types.join(', ')} } from '../types/${ctx.typeFile}'`
                ]
              }

              /**
               * The error the API sent: its state, its line above the content,
               * and the catch of a call that sets it.
               */
              const ERROR_STATE =
                '  const [error, setError] = useState<string>()'
              const ERROR_LINE =
                '      {error && <p className="error">{error}</p>}'
              const CATCH = '      .catch((e: Error) => setError(e.message))'

              /**
               * The value of a field of `item` as an expression: a date as its
               * day, a boolean as Yes or No, the values of a multiple field
               * joined. `nullable` tells whether it can be missing.
               */
              function expressionOf(ctx: any, field: any, item: string): any {
                const name = `${item}.${ctx.pattern.camelOf(field.name)}`
                if (field.multiple) {
                  return { text: `(${name} ?? []).join(', ')`, nullable: false }
                }
                if (field.widget === 'checkbox' || field.type?.name === 'Boolean') {
                  return { text: `${name} ? 'Yes' : 'No'`, nullable: false }
                }
                if (field.widget === 'date' || field.type?.name === 'Date') {
                  return { text: `${name}?.slice(0, 10)`, nullable: true }
                }
                return { text: name, nullable: true }
              }

              /** The JSX of the value of a field of `item`. */
              function valueOf(ctx: any, field: any, item: string): string {
                return `{${expressionOf(ctx, field, item).text}}`
              }

              /** The lines of a list page (a Table). */
              function tableLines(ctx: any): string[] {
                if (!ctx.client) return notAvailable(ctx, 'no API client')
                if (!ctx.ops.has('list')) return notAvailable(ctx, 'no list')
                const { pattern, fields } = ctx
                const creation = creationOf(ctx)
                const rowLink: any = ctx.child.rowLink
                const key = fields.some((f: any) => pattern.camelOf(f.name) === 'id')
                  || (ctx.payload.fields ?? []).some((f: any) => f.name === 'id')
                return [
                  "import { useEffect, useState } from 'react'",
                  "import { Link } from 'react-router'",
                  ...importLines(ctx, [ctx.type]),
                  '',
                  `export default function ${ctx.name}() {`,
                  `  const [items, setItems] = useState<${ctx.type}[]>([])`,
                  ERROR_STATE,
                  '',
                  '  useEffect(() => {',
                  `    ${ctx.api}.list()`,
                  '      .then(setItems)',
                  CATCH,
                  '  }, [])',
                  '',
                  '  return (',
                  '    <section>',
                  `      <h1>${jsxText(ctx.page.title)}</h1>`,
                  ...(creation
                    ? [`      <Link to=${linkTo(creation.route, () => '')}>New</Link>`]
                    : []),
                  ERROR_LINE,
                  '      <table>',
                  '        <thead>',
                  '          <tr>',
                  ...fields.map((f: any) =>
                    `            <th>${jsxText(f.label ?? f.name)}</th>`),
                  '          </tr>',
                  '        </thead>',
                  '        <tbody>',
                  `          {items.map((item${key ? '' : ', index'}) => (`,
                  `            <tr key={${key ? 'item.id' : 'index'}}>`,
                  ...fields.map((f: any, i: number) =>
                    cellLine(ctx, f, i === 0 ? rowLink : undefined)),
                  '            </tr>',
                  '          ))}',
                  '        </tbody>',
                  '      </table>',
                  '    </section>',
                  '  )',
                  '}'
                ]
              }

              /**
               * The line of a cell. The first one links to the row page, and
               * shows a dash for a missing value so that the link stays visible.
               */
              function cellLine(ctx: any, field: any, rowLink: any): string {
                if (!rowLink?.route) {
                  return `              <td>${valueOf(ctx, field, 'item')}</td>`
                }
                const value = expressionOf(ctx, field, 'item')
                const shown = value.nullable ? `${value.text} ?? '—'` : value.text
                const to = linkTo(rowLink.route, (p: string) =>
                  `item.${ctx.pattern.camelOf(p)}`)
                return `              <td><Link to=${to}>{${shown}}</Link></td>`
              }

              /**
               * The links of a detail page to its linked pages, labelled by their
               * kind: List, Detail, Edit (a form with a parameter) or New.
               */
              function linkLines(ctx: any): string[] {
                const links: any[] = ctx.page.links ?? []
                return links.flatMap((page: any) => {
                  const missing = paramsOf(page.route)
                    .filter((p: string) => !ctx.params.includes(p))
                  if (missing.length > 0) {
                    log.warning(`${ctx.name}: no ${missing[0]} for ${page.name}`)
                    return []
                  }
                  const label = page.kind === 'list' ? 'List'
                    : page.kind === 'detail' ? 'Detail'
                    : paramsOf(page.route).length > 0 ? 'Edit' : 'New'
                  return [`        <Link to=${linkTo(page.route, (p) => p)}>${label}</Link>`]
                })
              }

              /** The destructured parameters of the route of the page. */
              function paramsLines(ctx: any): string[] {
                if (ctx.params.length === 0) return []
                return [`  const { ${ctx.params.join(', ')} } = useParams()`]
              }

              /** The lines of a detail page (a Detail). */
              function detailLines(ctx: any): string[] {
                if (!ctx.client) return notAvailable(ctx, 'no API client')
                if (!ctx.ops.has('get')) return notAvailable(ctx, 'no get')
                if (ctx.params.length === 0) {
                  return notAvailable(ctx, 'no identifier in the route')
                }
                const canDelete = ctx.ops.has('delete')
                const list = siblingsOf(ctx, 'list')[0]
                const back = list ? JSON.stringify(list.route) : "'/'"
                const args = ctx.params.join(', ')
                const guard = ctx.params.map((p: string) => `!${p}`).join(' || ')
                return [
                  "import { useEffect, useState } from 'react'",
                  `import { Link, ${canDelete ? 'useNavigate, ' : ''}useParams } from 'react-router'`,
                  ...importLines(ctx, [ctx.type]),
                  '',
                  `export default function ${ctx.name}() {`,
                  ...paramsLines(ctx),
                  ...(canDelete ? ['  const navigate = useNavigate()'] : []),
                  `  const [item, setItem] = useState<${ctx.type}>()`,
                  ERROR_STATE,
                  '',
                  '  useEffect(() => {',
                  `    if (${guard}) return`,
                  `    ${ctx.api}.get(${args})`,
                  '      .then(setItem)',
                  CATCH,
                  `  }, [${args}])`,
                  ...(canDelete ? [
                    '',
                    '  function remove() {',
                    `    if (${guard}) return`,
                    `    ${ctx.api}.remove(${args})`,
                    `      .then(() => navigate(${back}))`,
                    CATCH,
                    '  }'
                  ] : []),
                  '',
                  '  return (',
                  '    <section>',
                  `      <h1>${jsxText(ctx.page.title)}</h1>`,
                  ERROR_LINE,
                  '      {item && (',
                  '        <dl>',
                  ...ctx.fields.flatMap((f: any) => [
                    `          <dt>${jsxText(f.label ?? f.name)}</dt>`,
                    `          <dd>${valueOf(ctx, f, 'item')}</dd>`
                  ]),
                  '        </dl>',
                  '      )}',
                  '      <p>',
                  ...linkLines(ctx),
                  ...(canDelete ? [
                    '        <button type="button" onClick={remove}>',
                    '          Delete',
                    '        </button>'
                  ] : []),
                  '      </p>',
                  '    </section>',
                  '  )',
                  '}'
                ]
              }

              /**
               * How a field of a form is held and controlled: `checkbox` (a
               * boolean), `options` (a list of the elements of the resource of a
               * relation field), `enum` (the values of an Enum), `lines` (a
               * multiple field in a text area) or `input` (a text, a number or a
               * date).
               */
              function controlOf(ctx: any, field: any): any {
                const type: any = field.type
                const values = Array.isArray(type?.values) ? type.values : undefined
                if (field.widget === 'checkbox') return { kind: 'checkbox' }
                if (field.widget === 'select' && values) {
                  return { kind: 'enum', values }
                }
                if (field.widget === 'select' && field.resource) {
                  const client = ctx.pattern.apiClientOf(ctx.frontend, field.resource)
                  const list = operationsOf(ctx.pattern, client).get('list')
                  if (client && list?.response) {
                    return {
                      kind: 'options',
                      api: ctx.pattern.pascalOf(client.name),
                      type: ctx.pattern.pascalOf(list.response.name),
                      typeFile: ctx.pattern.pascalOf(field.resource.name),
                      label: ctx.pattern.labelFieldOf(ctx.frontend, field.resource),
                      state: ctx.pattern.camelOf(`${field.name} options`)
                    }
                  }
                  log.warning(`${ctx.name}: no list for ${field.name}, a text input`)
                }
                if (field.multiple) return { kind: 'lines' }
                return { kind: 'input' }
              }

              /** The TypeScript type of the form value of a field. */
              function valueTypeOf(field: any, control: any): string {
                if (control.kind === 'checkbox') return 'boolean'
                if (control.kind === 'options' && field.multiple) return 'string[]'
                return 'string'
              }

              /** The empty form value of a field. */
              function emptyOf(field: any, control: any): string {
                if (control.kind === 'checkbox') return 'false'
                if (control.kind === 'options' && field.multiple) return '[]'
                return "''"
              }

              /** The form value of a field read from an element of the API. */
              function fromItem(ctx: any, field: any, control: any): string {
                const name = `item.${ctx.pattern.camelOf(field.name)}`
                if (control.kind === 'checkbox') return `Boolean(${name})`
                if (control.kind === 'options' && field.multiple) {
                  return `(${name} ?? []).map(String)`
                }
                if (control.kind === 'lines') return `(${name} ?? []).join('\\n')`
                if (field.type?.name === 'Date') return `(${name} ?? '').slice(0, 10)`
                return `String(${name} ?? '')`
              }

              /**
               * The value sent to the API for a field: a number, a date at
               * midnight UTC, an array, nothing for an empty optional value.
               */
              function toInput(ctx: any, field: any, control: any): string {
                const v = `values.${ctx.pattern.camelOf(field.name)}`
                const number = field.type?.name === 'Number'
                const cast = control.kind === 'enum'
                  ? ` as ${ctx.type}['${ctx.pattern.camelOf(field.name)}']`
                  : ''
                if (control.kind === 'checkbox') return v
                if (field.multiple) {
                  const all = control.kind === 'options' ? v
                    : `${v}.split('\\n').map((s) => s.trim()).filter(Boolean)`
                  return `${all}${number ? '.map(Number)' : ''}${cast}`
                }
                const one = number ? `Number(${v})`
                  : field.type?.name === 'Date' ? `\`\${${v}}T00:00:00.000Z\``
                  : v
                return field.mandatory
                  ? `${one}${cast}`
                  : `${v} === '' ? undefined : ${one}${cast}`
              }

              /** The attributes of a control: its value and its change. */
              function boundOf(
                name: string,
                control: any,
                required: boolean
              ): string[] {
                const req = required ? ['required'] : []
                if (control.kind === 'checkbox') {
                  return [
                    `checked={values.${name}}`,
                    `onChange={(e) => change('${name}', e.target.checked)}`
                  ]
                }
                if (control.kind === 'options' && control.multiple) {
                  return ['multiple', `value={values.${name}}`, ...req,
                    `onChange={(e) => change('${name}', Array.from(` +
                    'e.target.selectedOptions, (o) => o.value))}']
                }
                return [`value={values.${name}}`, ...req,
                  `onChange={(e) => change('${name}', e.target.value)}`]
              }

              /** The lines of an element: its attributes one per line. */
              function tagLines(
                tag: string,
                attributes: string[],
                end: string
              ) {
                return [
                  `          <${tag}`,
                  ...attributes.map((a: string) => `            ${a}`),
                  `          ${end}`
                ]
              }

              /** The lines of the control of a field, in its label (rule 9). */
              function controlLines(
                ctx: any,
                field: any,
                control: any
              ): string[] {
                const name = ctx.pattern.camelOf(field.name)
                const label = jsxText(field.label ?? field.name)
                const bound = boundOf(name, { ...control, multiple: field.multiple },
                  !!field.mandatory && control.kind !== 'checkbox')
                const type = field.type?.name === 'Number' ? 'number'
                  : field.widget === 'date' || field.type?.name === 'Date' ? 'date'
                  : 'text'
                const body = control.kind === 'checkbox'
                  ? tagLines('input', ['type="checkbox"', ...bound], '/>')
                  : control.kind === 'lines' || field.widget === 'textarea'
                  ? tagLines('textarea', bound, '/>')
                  : control.kind === 'enum' ? [
                      ...tagLines('select', bound, '>'),
                      '            <option value="">—</option>',
                      ...control.values.map((value: string) =>
                        `            <option value=${JSON.stringify(value)}>` +
                        `${jsxText(value)}</option>`),
                      '          </select>'
                    ]
                  : control.kind === 'options' ? [
                      ...tagLines('select', bound, '>'),
                      ...(field.multiple ? [] : ['            <option value="">—</option>']),
                      `            {${control.state}.map((option) => (`,
                      '              <option key={option.id} value={option.id}>',
                      `                {String(option.${control.label} ?? option.id)}`,
                      '              </option>',
                      '            ))}',
                      '          </select>'
                    ]
                  : tagLines('input', [`type="${type}"`,
                      ...(type === 'number' ? ['step="any"'] : []), ...bound], '/>')
                return ['        <label>', `          ${label}`, ...body, '        </label>']
              }

              /** The lines of a form page (a Form). */
              function formLines(ctx: any): string[] {
                if (!ctx.client) return notAvailable(ctx, 'no API client')
                const { pattern } = ctx
                const operation = pattern.operationOf(ctx.child.endpoint)
                if (operation !== 'create' && operation !== 'update') {
                  return notAvailable(ctx, `a ${operation} endpoint`)
                }
                if (!ctx.ops.has(operation)) {
                  return notAvailable(ctx, `no ${operation}`)
                }
                const sent = ctx.ops.get(operation)
                const reads = ctx.params.length > 0 && ctx.ops.has('get')
                if (ctx.params.length > 0 && !reads) {
                  log.warning(`${ctx.name}: no get, the form starts empty`)
                }
                if (operation === 'update' && ctx.params.length === 0) {
                  return notAvailable(ctx, 'no identifier for update')
                }
                const controls = ctx.fields.map((f: any) => controlOf(ctx, f))
                const options = controls
                  .filter((c: any) => c.kind === 'options')
                  .filter((c: any, i: number, all: any[]) =>
                    all.findIndex((o: any) => o.state === c.state) === i)
                const item = reads ? ctx.ops.get('get').response : undefined
                const itemType = item ? pattern.pascalOf(item.name) : undefined
                const types = new Map<string, string[]>([[ctx.typeFile, [ctx.type]]])
                if (itemType) types.get(ctx.typeFile)!.push(itemType)
                for (const o of options) {
                  types.set(o.typeFile, [...(types.get(o.typeFile) ?? []), o.type])
                }
                const apis = [ctx.api, ...options.map((o: any) => o.api)]
                const after = afterLines(ctx, sent)
                const hooks = [...after.hooks,
                  ...(ctx.params.length > 0 ? ['useParams'] : [])]
                return [
                  "import { useEffect, useState, type FormEvent } from 'react'",
                  ...(hooks.length > 0
                    ? [`import { ${hooks.join(', ')} } from 'react-router'`]
                    : []),
                  ...importsOf(apis, types),
                  '',
                  'interface Values {',
                  ...ctx.fields.map((f: any, i: number) =>
                    `  ${pattern.camelOf(f.name)}: ${valueTypeOf(f, controls[i])}`),
                  '}',
                  '',
                  'const EMPTY: Values = {',
                  ...ctx.fields.map((f: any, i: number) =>
                    `  ${pattern.camelOf(f.name)}: ${emptyOf(f, controls[i])},`),
                  '}',
                  ...(itemType ? [
                    '',
                    `function valuesOf(item: ${itemType}): Values {`,
                    '  return {',
                    ...ctx.fields.map((f: any, i: number) =>
                      `    ${pattern.camelOf(f.name)}: ${fromItem(ctx, f, controls[i])},`),
                    '  }',
                    '}'
                  ] : []),
                  '',
                  `function inputOf(values: Values): ${ctx.type} {`,
                  '  return {',
                  ...ctx.fields.map((f: any, i: number) =>
                    `    ${pattern.camelOf(f.name)}: ${toInput(ctx, f, controls[i])},`),
                  '  }',
                  '}',
                  '',
                  `export default function ${ctx.name}() {`,
                  ...paramsLines(ctx),
                  ...after.state,
                  '  const [values, setValues] = useState<Values>(EMPTY)',
                  ...options.map((o: any) =>
                    `  const [${o.state}, set${pattern.pascalOf(o.state)}] =` +
                    ` useState<${o.type}[]>([])`),
                  ERROR_STATE,
                  ...options.flatMap((o: any) => [
                    '',
                    '  useEffect(() => {',
                    `    ${o.api}.list()`,
                    `      .then(set${pattern.pascalOf(o.state)})`,
                    CATCH,
                    '  }, [])'
                  ]),
                  ...(reads ? readLines(ctx) : []),
                  '',
                  '  function change<K extends keyof Values>(name: K, value: Values[K]) {',
                  '    setValues((current) => ({ ...current, [name]: value }))',
                  '  }',
                  '',
                  '  function submit(event: FormEvent) {',
                  '    event.preventDefault()',
                  ...submitLines(ctx, operation, after),
                  '  }',
                  '',
                  '  return (',
                  '    <section>',
                  `      <h1>${jsxText(ctx.page.title)}</h1>`,
                  ERROR_LINE,
                  '      <form onSubmit={submit}>',
                  ...ctx.fields.flatMap((f: any, i: number) =>
                    controlLines(ctx, f, controls[i])),
                  '        <button type="submit">Save</button>',
                  '      </form>',
                  '    </section>',
                  '  )',
                  '}'
                ]
              }

              /**
               * The imports of a form: each API client once, and the payload
               * types of each types file once each.
               */
              function importsOf(apis: string[], types: Map<string, string[]>) {
                const once = (names: string[]) =>
                  names.filter((n: string, i: number) => names.indexOf(n) === i)
                return [
                  ...once(apis).map((api: string) =>
                    `import * as ${api} from '../api/${api}'`),
                  ...[...types].map(([file, names]) =>
                    `import type { ${once(names).join(', ')} } from '../types/${file}'`)
                ]
              }

              /** The lines that fill the form from the element to edit. */
              function readLines(ctx: any): string[] {
                const args = ctx.params.join(', ')
                const guard = ctx.params.map((p: string) => `!${p}`).join(' || ')
                return [
                  '',
                  '  useEffect(() => {',
                  `    if (${guard}) return`,
                  `    ${ctx.api}.get(${args})`,
                  '      .then((item) => setValues(valuesOf(item)))',
                  CATCH,
                  `  }, [${args}])`
                ]
              }

              /**
               * Where a sent form goes: the detail page of the resource with the
               * identifier of the element sent back, else its list page.
               */
              function afterLines(ctx: any, sent: any): any {
                const detail = siblingsOf(ctx, 'detail')[0]
                const list = siblingsOf(ctx, 'list')[0]
                const target = detail ?? list
                if (!target) {
                  log.warning(`${ctx.name}: no detail or list page to go to`)
                  return { hooks: [], state: [], then: undefined }
                }
                const fromResponse = !!sent?.response
                const to = routeOf(target.route, (p: string) =>
                  fromResponse ? `item.${ctx.pattern.camelOf(p)}` : p)
                return {
                  hooks: ['useNavigate'],
                  state: ['  const navigate = useNavigate()'],
                  then: fromResponse
                    ? `      .then((item) => navigate(${to}))`
                    : `      .then(() => navigate(${to}))`
                }
              }

              /** The lines that send the form by `create` or `update`. */
              function submitLines(
                ctx: any,
                operation: string,
                after: any
              ): string[] {
                const args = operation === 'update'
                  ? [...ctx.params.map((p: string) => `${p}!`), 'inputOf(values)']
                  : ['inputOf(values)']
                const call = operation === 'update' ? 'update' : 'create'
                return [
                  `    ${ctx.api}.${call}(${args.join(', ')})`,
                  ...(after.then ? [after.then] : []),
                  CATCH
                ]
              }
