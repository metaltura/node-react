      - name: NodeReactToProject
        instanceOf: Core:Class
        icon: mui:Layers
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Node:express.Server
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import { Folder, MarkdownFile, TextFile } from 'FileSystem'
              import { nodeToCode } from 'NodeReactToCode/node'
              import { reactToCode } from 'NodeReactToCode/react'

              /**
               * NodeReactToProject — the stack pattern for Node + React (rules 14
               * and 15). Branched on a Node server, it writes a single project in
               * a system folder: an npm workspaces root (`package.json`,
               * `README.md`, `.gitignore`), the server project under `server/`
               * (ServerToProject, as is) and the client project of the React
               * frontend of the same application under `client/`
               * (FrontendToProject). `npm install` then `npm start` at the root
               * start both. The folder stands alone as a repository once copied.
               */
              export default function (source) {
                const server: any = source
                if (!server.application) {
                  throw new Error(`${server.name}: the server has no application`)
                }
                const frontend = frontendOf(server)
                const textFile = (name: string, ext: string, fileType: string, lines: string[]) =>
                  new TextFile({
                    name: this.fileNameOf(name, ext),
                    fileType,
                    text: this.textOf(lines)
                  })
                return [
                  textFile('package', 'json', 'json', packageOf(this, server)),
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(server, frontend))
                  }),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist']),
                  new Folder({
                    name: 'server',
                    entries: mapAll(server, nodeToCode)
                  }),
                  ...(frontend
                    ? [new Folder({
                        name: 'client',
                        entries: mapAll(frontend, reactToCode)
                      })]
                    : [])
                ]
              }

              /**
               * The React frontend of the application of the server: the first
               * one, with a warning when there are several or none.
               */
              function frontendOf(server: any): any {
                const frontends: any[] = (server.application.frontends ?? [])
                  .filter((f: any) => f.instanceOf?._inherits(e('React:Frontend')))
                const app = server.application.name
                if (frontends.length === 0) {
                  log.warning(`${server.name}: no React frontend in ${app}`)
                  return undefined
                }
                if (frontends.length > 1) {
                  const n = frontends.length
                  log.warning(`${server.name}: ${n} React frontends, using ${frontends[0].name}`)
                }
                return frontends[0]
              }

              /**
               * The lines of the root `package.json` (rule 15): private, the two
               * workspaces, `start` runs both with concurrently, `build` and
               * `typecheck` run each in turn, versions pinned.
               */
              function packageOf(pattern: any, server: any): string[] {
                return [
                  '{',
                  `  "name": "${pattern.kebabOf(server.application.name)}",`,
                  '  "version": "0.1.0",',
                  '  "private": true,',
                  '  "workspaces": ["server", "client"],',
                  '  "scripts": {',
                  '    "start": "concurrently -n server,client \\"npm run start -w server\\" \\"npm run start -w client\\"",',
                  '    "build": "npm run build -ws --if-present",',
                  '    "typecheck": "npm run typecheck -ws --if-present"',
                  '  },',
                  '  "devDependencies": {',
                  '    "concurrently": "9.2.5"',
                  '  }',
                  '}'
                ]
              }

              /** The lines of the root `README.md`: how to run the whole. */
              function readmeOf(server: any, frontend: any): string[] {
                const app = server.application
                const title = app.title || app.name
                const port = server.port ?? 3000
                return [
                  `# ${title} — Node + React`,
                  '',
                  `Generated from the Node server \`${server.name}\`${frontend ? ` and the React frontend \`${frontend.name}\`` : ''} of`,
                  `the application \`${app.name}\`. Regenerated at each change of the model: edit the`,
                  'model, not these files.',
                  '',
                  '- `server/` — the API: Node + Express + MongoDB.',
                  ...(frontend
                    ? ['- `client/` — the user interface: Vite + React + TypeScript.']
                    : []),
                  '',
                  '## Run',
                  '',
                  '1. A MongoDB server: `server/README.md` says which one.',
                  '2. `npm install` — installs both projects.',
                  `3. \`npm start\` — the API listens on \`http://localhost:${port}\`${frontend ? ', the client opens' : ''}`,
                  ...(frontend ? ['   on `http://localhost:5173` and calls the API through Vite.'] : []),
                  '',
                  '`npm run typecheck` checks the types of both projects, `npm run build`',
                  'builds them. Each project also runs alone: `npm start` in its folder.'
                ]
              }
